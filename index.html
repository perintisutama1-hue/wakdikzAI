<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OtakAI — Ultra Coding Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --bg3: #14141f;
    --panel: #16161f;
    --border: #1e1e2e;
    --border2: #2a2a3e;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --accent3: #c084fc;
    --green: #10b981;
    --cyan: #06b6d4;
    --red: #ef4444;
    --yellow: #f59e0b;
    --orange: #f97316;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
    --glow: 0 0 20px rgba(124,58,237,0.3);
    --glow2: 0 0 40px rgba(124,58,237,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 15px rgba(124,58,237,0.5);
  }
  .logo span { background: linear-gradient(135deg, var(--accent3), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .header-chips { display: flex; gap: 6px; margin-left: 8px; }
  .chip {
    font-size: 10px; padding: 2px 8px; border-radius: 20px;
    border: 1px solid; font-weight: 500; letter-spacing: 0.5px;
    font-family: 'Syne', sans-serif;
  }
  .chip-purple { border-color: var(--accent); color: var(--accent3); background: rgba(124,58,237,0.1); }
  .chip-green { border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.1); }
  .chip-cyan { border-color: var(--cyan); color: var(--cyan); background: rgba(6,182,212,0.1); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .btn-icon {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent3); background: rgba(124,58,237,0.15); }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── MAIN LAYOUT ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.3s;
    overflow: hidden;
  }
  .sidebar.collapsed { width: 52px; }

  .sidebar-section { padding: 12px 8px 6px; }
  .sidebar-label {
    font-size: 9px; font-weight: 600; letter-spacing: 1.5px;
    color: var(--text3); text-transform: uppercase;
    padding: 0 8px; margin-bottom: 4px;
    font-family: 'Syne', sans-serif;
    white-space: nowrap; overflow: hidden;
  }

  .tool-btn {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; border: none;
    background: transparent; color: var(--text2);
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; text-align: left;
    transition: all 0.15s; white-space: nowrap; overflow: hidden;
  }
  .tool-btn:hover { background: rgba(124,58,237,0.1); color: var(--text); }
  .tool-btn.active { background: rgba(124,58,237,0.2); color: var(--accent3); border-left: 2px solid var(--accent); }
  .tool-btn .ti { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
  .tool-btn .tl { flex:1; overflow: hidden; text-overflow: ellipsis; }
  .tool-btn .tb { font-size: 9px; background: var(--accent); color: white; border-radius: 3px; padding: 1px 4px; flex-shrink:0; }

  .lang-select-wrap { padding: 8px; }
  .lang-select {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 11px; cursor: pointer; outline: none;
    transition: border-color 0.2s;
  }
  .lang-select:focus { border-color: var(--accent); }

  .sidebar-divider { height: 1px; background: var(--border); margin: 4px 8px; }

  /* ── CHAT AREA ── */
  .chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  /* hero when empty */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-size: 42px; font-weight: 800;
    text-align: center; line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, var(--accent3) 50%, var(--cyan) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-sub { color: var(--text2); font-size: 13px; text-align: center; max-width: 480px; line-height: 1.7; }

  .quick-chips {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px;
  }
  .quick-chip {
    padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text2);
    font-size: 11px; cursor: pointer;
    transition: all 0.2s; font-family: 'JetBrains Mono', monospace;
  }
  .quick-chip:hover {
    border-color: var(--accent); color: var(--accent3);
    background: rgba(124,58,237,0.1); transform: translateY(-1px);
  }

  /* messages */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg {
    display: flex; gap: 12px;
    animation: msgIn 0.3s ease;
    max-width: 100%;
  }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .msg-avatar { background: linear-gradient(135deg, var(--blue), var(--accent)); }
  .msg.ai .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    box-shadow: 0 0 12px rgba(124,58,237,0.4);
  }

  .msg-body { flex: 1; min-width: 0; }
  .msg-meta { font-size: 10px; color: var(--text3); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .msg.user .msg-meta { justify-content: flex-end; }

  .msg-bubble {
    padding: 12px 16px; border-radius: 12px;
    font-size: 13px; line-height: 1.7;
    word-wrap: break-word; overflow-wrap: break-word;
    position: relative;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(59,130,246,0.15));
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 12px 4px 12px 12px;
    margin-left: 40px;
  }
  .msg.ai .msg-bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
    margin-right: 40px;
  }

  /* code blocks */
  .code-block {
    margin: 10px 0; border-radius: 10px;
    border: 1px solid var(--border2);
    overflow: hidden; background: #0d0d14;
  }
  .code-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: var(--bg3);
    border-bottom: 1px solid var(--border2);
    font-size: 11px;
  }
  .code-lang { color: var(--accent3); font-weight: 500; }
  .code-actions { display: flex; gap: 6px; }
  .code-act-btn {
    padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border2);
    background: transparent; color: var(--text2); font-size: 10px;
    cursor: pointer; font-family: 'JetBrains Mono', monospace;
    transition: all 0.15s;
  }
  .code-act-btn:hover { border-color: var(--accent); color: var(--accent3); background: rgba(124,58,237,0.1); }
  .code-act-btn.copied { border-color: var(--green); color: var(--green); }

  pre {
    padding: 14px; overflow-x: auto; font-size: 12.5px;
    line-height: 1.6; color: #e2e8f0;
    font-family: 'JetBrains Mono', monospace;
    max-height: 600px;
  }
  pre::-webkit-scrollbar { height: 4px; }
  pre::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* syntax highlight basic */
  .kw { color: #c084fc; }
  .str { color: #86efac; }
  .cmt { color: #475569; font-style: italic; }
  .num { color: #fbbf24; }
  .fn { color: #67e8f9; }
  .cls { color: #fb923c; }
  .op { color: #94a3b8; }

  /* inline code */
  .msg-bubble code:not(pre code) {
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.25);
    border-radius: 4px; padding: 1px 5px;
    font-size: 12px; color: var(--accent3);
  }

  /* thinking indicator */
  .thinking {
    display: flex; gap: 4px; align-items: center; padding: 4px 0;
  }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2); animation: bounce 1s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  /* streaming cursor */
  .cursor-blink::after {
    content: '▋'; animation: blink 0.7s infinite;
    color: var(--accent3); font-size: 0.9em;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── INPUT AREA ── */
  .input-area {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }

  .input-toolbar {
    display: flex; gap: 6px; margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .toolbar-btn {
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border2); background: var(--bg3);
    color: var(--text2); font-size: 10px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; transition: all 0.15s;
    white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent3); background: rgba(124,58,237,0.1); }
  .toolbar-btn.active { border-color: var(--accent); color: var(--accent3); background: rgba(124,58,237,0.15); }

  .input-box {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 12px; padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
  }

  #userInput {
    flex: 1; background: transparent; border: none;
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 13px; resize: none; outline: none;
    min-height: 40px; max-height: 200px;
    line-height: 1.6;
  }
  #userInput::placeholder { color: var(--text3); }

  .send-btn {
    width: 38px; height: 38px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white; font-size: 16px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; box-shadow: 0 0 15px rgba(124,58,237,0.4);
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(124,58,237,0.6); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: 0.4; transform: none; cursor: not-allowed; }

  .input-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding: 0 2px;
  }
  .input-hint { font-size: 9px; color: var(--text3); }
  .token-counter { font-size: 9px; color: var(--text3); }

  /* ── RIGHT PANEL ── */
  .right-panel {
    width: 340px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0; overflow: hidden;
    transition: width 0.3s;
  }
  .right-panel.hidden { width: 0; border: none; }

  .panel-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ptab {
    flex: 1; padding: 10px 6px;
    background: transparent; border: none;
    color: var(--text2); font-size: 10px;
    font-family: 'Syne', sans-serif; font-weight: 600;
    cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase;
    border-bottom: 2px solid transparent;
    transition: all 0.15s; white-space: nowrap;
  }
  .ptab.active { color: var(--accent3); border-bottom-color: var(--accent); }
  .ptab:hover { color: var(--text); }

  .panel-content { flex: 1; overflow-y: auto; padding: 14px; }
  .panel-content::-webkit-scrollbar { width: 3px; }
  .panel-content::-webkit-scrollbar-thumb { background: var(--border2); }

  .panel-section { margin-bottom: 20px; }
  .panel-section-title {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text3);
    margin-bottom: 10px; font-family: 'Syne', sans-serif;
  }

  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px;
    background: var(--bg3); border: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .setting-label { font-size: 11px; color: var(--text2); }
  .setting-value { font-size: 11px; color: var(--accent3); }

  /* toggle */
  .toggle {
    width: 36px; height: 20px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border2);
    cursor: pointer; position: relative; transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle::after {
    content: ''; position: absolute;
    width: 14px; height: 14px; border-radius: 50%;
    background: white; top: 2px; left: 2px;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(16px); }

  /* slider */
  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  input[type=range] {
    flex: 1; -webkit-appearance: none;
    height: 3px; background: var(--border2); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent2); cursor: pointer;
    box-shadow: 0 0 8px rgba(168,85,247,0.5);
  }

  /* stats */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card {
    padding: 12px; border-radius: 8px;
    background: var(--bg3); border: 1px solid var(--border);
    text-align: center;
  }
  .stat-num { font-size: 20px; font-weight: 700; font-family: 'Syne', sans-serif; color: var(--accent3); }
  .stat-lbl { font-size: 9px; color: var(--text3); margin-top: 2px; letter-spacing: 0.5px; }

  /* history items */
  .hist-item {
    padding: 10px; border-radius: 8px;
    background: var(--bg3); border: 1px solid var(--border);
    margin-bottom: 6px; cursor: pointer;
    transition: all 0.15s;
  }
  .hist-item:hover { border-color: var(--accent); background: rgba(124,58,237,0.08); }
  .hist-title { font-size: 11px; color: var(--text); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-meta { font-size: 9px; color: var(--text3); display: flex; gap: 8px; }

  /* notification */
  .notif {
    position: fixed; top: 60px; right: 20px;
    padding: 10px 16px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--green);
    color: var(--green); font-size: 11px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: notifIn 0.3s ease, notifOut 0.3s ease 2.7s forwards;
    z-index: 100;
  }
  @keyframes notifIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
  @keyframes notifOut { to{opacity:0;transform:translateX(20px)} }

  /* scrollbar general */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* mode badges */
  .mode-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px;
    font-size: 9px; font-weight: 600;
    border: 1px solid;
  }

  /* diff view */
  .diff-add { background: rgba(16,185,129,0.1); border-left: 3px solid var(--green); }
  .diff-rem { background: rgba(239,68,68,0.1); border-left: 3px solid var(--red); }

  /* file upload area */
  .file-drop {
    border: 2px dashed var(--border2);
    border-radius: 10px; padding: 20px;
    text-align: center; color: var(--text3);
    font-size: 11px; cursor: pointer;
    transition: all 0.2s; margin-bottom: 10px;
  }
  .file-drop:hover { border-color: var(--accent); color: var(--accent3); background: rgba(124,58,237,0.05); }

  /* responsive */
  @media (max-width: 900px) {
    .right-panel { display: none; }
    .sidebar { width: 52px; }
    .sidebar-label, .tl, .tb { display: none; }
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <span>OtakAI</span>
  </div>
  <div class="header-chips">
    <span class="chip chip-purple">ULTRA</span>
    <span class="chip chip-green">UNLIMITED</span>
    <span class="chip chip-cyan">CODING</span>
  </div>
  <div class="header-right">
    <div class="status-dot" title="API Connected"></div>
    <button class="btn-icon" onclick="clearChat()" title="New Chat">✦</button>
    <button class="btn-icon" onclick="toggleRight()" title="Toggle Panel">⊞</button>
  </div>
</header>

<!-- ── MAIN ── -->
<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Mode</div>
      <button class="tool-btn active" onclick="setMode('auto', this)">
        <span class="ti">🤖</span><span class="tl">Auto (Best)</span>
      </button>
      <button class="tool-btn" onclick="setMode('explain', this)">
        <span class="ti">📖</span><span class="tl">Explain Code</span>
      </button>
      <button class="tool-btn" onclick="setMode('debug', this)">
        <span class="ti">🐛</span><span class="tl">Debug & Fix</span>
      </button>
      <button class="tool-btn" onclick="setMode('refactor', this)">
        <span class="ti">♻️</span><span class="tl">Refactor</span>
      </button>
      <button class="tool-btn" onclick="setMode('review', this)">
        <span class="ti">🔍</span><span class="tl">Code Review</span>
      </button>
      <button class="tool-btn" onclick="setMode('test', this)">
        <span class="ti">✅</span><span class="tl">Write Tests</span>
      </button>
      <button class="tool-btn" onclick="setMode('docs', this)
